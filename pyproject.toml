[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "hermes-proxy-codex"
version = "0.1.0"
description = "Local text Chat Completions composition over the Hermes Codex proxy"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["aiohttp==3.14.3"]

[project.scripts]
hermes-proxy-codex = "hermes_proxy_codex.cli:main"

[tool.hatch.build]
exclude = ["**/__pycache__", "**/*.pyc", "**/.env*", "**/auth.json", "**/credentials*", "**/.agent-temp"]

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_proxy_codex"]

[tool.hatch.build.targets.sdist]
include = ["/src/hermes_proxy_codex", "/README.md", "/SECURITY.md", "/LICENSE", "/pyproject.toml"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
