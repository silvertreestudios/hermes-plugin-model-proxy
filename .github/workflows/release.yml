name: Draft wheel release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing reviewed tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: draft-wheel-release
  cancel-in-progress: false
jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.verify.outputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Verify existing merged tag and versions
        id: verify
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          COMMIT=$(python scripts/release.py preflight --tag "$RELEASE_TAG")
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
  ci:
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      checkout_ref: ${{ needs.preflight.outputs.commit }}
  publish:
    needs: [preflight, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only trusted dispatch-main code runs in this job, never tagged source.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-dist-${{ github.run_id }}
          path: release-dist
      - name: Validate assets, recheck tag and create draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_COMMIT: ${{ needs.preflight.outputs.commit }}
          RELEASE_REPO: ${{ github.repository }}
        run: >-
          python scripts/release.py publish --tag "$RELEASE_TAG"
          --commit "$RELEASE_COMMIT" --repo "$RELEASE_REPO"
          --directory release-dist
