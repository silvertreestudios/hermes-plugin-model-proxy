name: Commit wheel release
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: wheel-release-${{ github.sha }}
  cancel-in-progress: false
jobs:
  ci:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      checkout_ref: ${{ github.sha }}
  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Exact event commit; never a moving main ref.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-dist-${{ github.run_id }}
          path: release-dist
      - name: Validate tested assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REPO: ${{ github.repository }}
        run: >-
          python scripts/release.py publish
          --commit "$RELEASE_COMMIT" --repo "$RELEASE_REPO"
          --directory release-dist --event "$RELEASE_EVENT" --ref "$RELEASE_REF"
