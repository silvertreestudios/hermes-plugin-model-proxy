name: CI
on:
  pull_request:
  push:
    branches: ['feat/**']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Read public pinned Hermes source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: NousResearch/hermes-agent
          ref: 749220ef0007f8d87bd1531f1c24b0fe93816385
          path: .agent-temp/hermes
          persist-credentials: false
      - name: Minimal test and build dependencies
        run: python -m pip install -r requirements-ci.txt -r requirements-dev.txt
      - name: Lint and syntax
        run: |
          ruff check src tests
          python -m compileall -q src tests
      - name: Build and inspect distributions
        run: |
          python -m hatchling build
          python tests/check_artifacts.py
      - name: Install source distribution
        run: python -m pip install --no-deps --no-build-isolation dist/*.tar.gz
      - name: Source installation smoke
        run: hermes-proxy-codex --help
      - name: Install wheel
        run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Wheel installation smoke
        run: hermes-proxy-codex --help
      - name: Offline tests against real upstream proxy
        env:
          PYTHONPATH: .agent-temp/hermes:tests
          HERMES_HOME: ${{ runner.temp }}/synthetic-hermes-home
        run: python -m unittest discover -s tests -v
